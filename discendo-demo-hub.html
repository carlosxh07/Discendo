<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discendo — Demo Study Hub (alle 14 Module)</title>
<style>
  :root{
    --blue:#2F6FE0;
    --blue-light:#5C90F2;
    --blue-dim:rgba(47,111,224,.16);
    --black:#1A1A1A;
    --bg:#121317;
    --bg-2:#17181D;
    --panel:#1C1D24;
    --panel-2:#22232B;
    --border:rgba(255,255,255,.08);
    --border-soft:rgba(255,255,255,.05);
    --text:#F2F3F7;
    --text-dim:#B4B7C4;
    --text-faint:#7B7E8C;
    --good:#38B26B;
    --bad:#E0533E;
    --radius-xl:26px;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --shadow-sm:0 4px 14px rgba(0,0,0,.28);
    --glow-blue:0 0 0 3px rgba(47,111,224,.22);
    --font: 'Segoe UI', 'Inter', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{scrollbar-color: #3a3c47 var(--bg-2); scrollbar-width:thin;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg-2);}
  ::-webkit-scrollbar-thumb{background:#34363f; border-radius:8px; border:2px solid var(--bg-2);}
  ::-webkit-scrollbar-thumb:hover{background:#3f424d;}
  body{
    background:radial-gradient(1200px 800px at 15% -10%, #1a2440 0%, transparent 60%), var(--bg);
    color:var(--text);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--blue); color:#fff;}
  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- Info bar ---------- */
  .infobar{
    display:flex; align-items:center; gap:12px;
    background:linear-gradient(90deg, var(--blue-dim), rgba(47,111,224,.03));
    border-bottom:1px solid var(--border);
    padding:12px 22px;
    font-size:13.5px;
    color:var(--text-dim);
    position:relative; z-index:5;
  }
  .infobar .dot{
    flex:0 0 auto; width:22px; height:22px; border-radius:50%;
    background:linear-gradient(150deg, var(--blue-light), var(--blue));
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; box-shadow:0 2px 8px rgba(47,111,224,.4);
  }
  .infobar strong{color:var(--text); font-weight:600;}

  /* ---------- Layout ---------- */
  .app{
    display:flex;
    min-height:calc(100vh - 46px);
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:300px; flex:0 0 300px;
    background:var(--bg-2);
    border-right:1px solid var(--border);
    padding:22px 14px 22px;
    display:flex; flex-direction:column; gap:18px;
    position:sticky; top:0; align-self:flex-start;
    height:calc(100vh - 46px);
    overflow-y:auto;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    padding:4px 10px 14px;
    border-bottom:1px solid var(--border-soft);
  }
  .brand .mark{
    width:36px; height:36px; border-radius:var(--radius-sm);
    background:linear-gradient(135deg, var(--blue), #1c4fb0);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:16px; color:#fff;
    box-shadow:0 4px 14px rgba(47,111,224,.35);
  }
  .brand .name{font-weight:700; font-size:16.5px; letter-spacing:.2px;}
  .brand .tag{font-size:11.5px; color:var(--text-faint); margin-top:1px;}

  .dashboard-btn{margin-bottom:2px;}
  .dashboard-btn .home-icon{color:var(--text-faint); display:flex; align-items:center; justify-content:center;}
  .dashboard-btn.active .home-icon{color:#fff;}
  .nav-divider{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; font-weight:700;
    color:var(--text-faint); padding:10px 12px 4px;
  }
  .navlist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px;}
  .navlist li{}
  .navbtn{
    width:100%; text-align:left; display:flex; align-items:center; gap:11px;
    background:transparent; border:1px solid transparent; color:var(--text-dim);
    padding:10px 12px; border-radius:var(--radius-md); cursor:pointer;
    font-size:13.4px; position:relative; transition:background .15s, color .15s, border-color .15s;
  }
  .navbtn::before{
    content:""; position:absolute; left:0; top:50%; transform:translateY(-50%);
    width:3px; height:0; border-radius:0 3px 3px 0; background:var(--blue); transition:height .15s;
  }
  .navbtn:hover{background:var(--panel); color:var(--text);}
  .navbtn.active{
    background:linear-gradient(90deg, var(--blue-dim), rgba(47,111,224,.05)); color:var(--text); border-color:rgba(47,111,224,.35);
  }
  .navbtn.active::before{height:20px;}
  .navbtn .num{
    flex:0 0 auto; width:24px; height:24px; border-radius:8px;
    background:var(--panel-2); color:var(--text-faint);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; transition:background .15s, color .15s;
  }
  .navbtn.active .num{background:var(--blue); color:#fff; box-shadow:0 2px 8px rgba(47,111,224,.45);}
  .navbtn .labelwrap{display:flex; flex-direction:column; gap:1px; min-width:0;}
  .navbtn .lbl{font-weight:600; color:inherit; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .navbtn .sub{font-size:10.8px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* ---------- Main ---------- */
  .main{flex:1; min-width:0; padding:30px 40px 70px;}
  .module{display:none; animation:fadein .25s ease;}
  .module.active{display:block;}
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  .module-head{margin-bottom:24px; padding-bottom:20px; border-bottom:1px solid var(--border-soft);}
  .module-head .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:11.5px; text-transform:uppercase; letter-spacing:.09em;
    color:var(--blue-light); font-weight:700; margin-bottom:10px;
  }
  .module-head .eyebrow .pill{
    background:var(--blue-dim); border:1px solid rgba(47,111,224,.35);
    padding:3px 10px; border-radius:999px; color:var(--text-dim); font-weight:600; letter-spacing:0;
    text-transform:none; font-size:11.5px;
  }
  .module-head h1{font-size:27px; margin:0 0 8px; font-weight:800; letter-spacing:-.01em;}
  .module-head p{margin:0; color:var(--text-dim); font-size:14px; max-width:720px; line-height:1.6;}

  .card{
    background:linear-gradient(175deg, var(--panel), var(--panel) 60%, #1a1b21);
    border:1px solid var(--border);
    border-radius:var(--radius-lg); padding:22px 24px; box-shadow:var(--shadow);
    position:relative;
  }
  .grid{display:grid; gap:16px;}
  .g2{grid-template-columns:1fr 1fr;}
  @media(max-width:900px){.g2{grid-template-columns:1fr;}}

  /* generic small helpers */
  .btn{
    background:linear-gradient(160deg, var(--blue-light), var(--blue));
    color:#fff; border:none; padding:10px 18px;
    border-radius:var(--radius-md); font-size:13.5px; font-weight:700; cursor:pointer;
    box-shadow:0 3px 12px rgba(47,111,224,.32);
    transition:filter .15s, transform .1s, box-shadow .15s;
  }
  .btn:hover{filter:brightness(1.08); box-shadow:0 4px 16px rgba(47,111,224,.42);}
  .btn:active{transform:scale(.97);}
  .btn:focus-visible{outline:none; box-shadow:var(--glow-blue), 0 3px 12px rgba(47,111,224,.32);}
  .btn.ghost{background:var(--panel-2); border:1px solid var(--border); color:var(--text-dim); box-shadow:none;}
  .btn.ghost:hover{color:var(--text); border-color:var(--blue-light); filter:none;}
  .btn.small{padding:7px 13px; font-size:12.5px; border-radius:var(--radius-sm);}
  .btn:disabled{opacity:.4; cursor:not-allowed; filter:none; transform:none;}

  .badge{display:inline-block; padding:4px 11px; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:.02em;}
  .badge.good{background:rgba(56,178,107,.15); color:#5CD68A; border:1px solid rgba(56,178,107,.35);}
  .badge.bad{background:rgba(224,83,62,.15); color:#F0806E; border:1px solid rgba(224,83,62,.35);}
  .badge.neutral{background:var(--panel-2); color:var(--text-dim); border:1px solid var(--border);}

  /* ===== Dashboard ===== */
  .dash-hero{
    position:relative; overflow:hidden;
    background:linear-gradient(150deg, #1b2a52 0%, var(--panel) 55%, var(--panel) 100%);
    border:1px solid var(--border); border-radius:var(--radius-xl);
    padding:38px 40px; margin-bottom:30px; box-shadow:var(--shadow);
  }
  .dash-hero::after{
    content:""; position:absolute; top:-60px; right:-60px; width:280px; height:280px;
    background:radial-gradient(circle, rgba(47,111,224,.35), transparent 70%);
    pointer-events:none;
  }
  .dash-hero-badge{
    display:inline-flex; align-items:center; gap:6px;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15);
    color:var(--blue-light); font-size:11.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    padding:5px 12px; border-radius:999px; margin-bottom:16px; position:relative;
  }
  .dash-hero h1{font-size:32px; font-weight:800; margin:0 0 12px; letter-spacing:-.015em; max-width:620px; position:relative;}
  .dash-hero p{font-size:14.5px; color:var(--text-dim); line-height:1.65; max-width:600px; margin:0 0 26px; position:relative;}
  .dash-stats{display:flex; gap:34px; flex-wrap:wrap; position:relative;}
  .dash-stat-num{font-size:28px; font-weight:800; color:var(--text); line-height:1;}
  .dash-stat-lbl{font-size:12px; color:var(--text-faint); margin-top:5px; font-weight:600;}

  .dash-section-label{
    font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; font-weight:700;
    color:var(--text-faint); margin-bottom:14px;
  }
  .dash-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(255px,1fr)); gap:16px;}
  .dash-card{
    background:linear-gradient(175deg, var(--panel), #1a1b21);
    border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:20px; cursor:pointer; transition:transform .18s, border-color .18s, box-shadow .18s;
    display:flex; flex-direction:column; gap:10px;
  }
  .dash-card:hover{transform:translateY(-3px); border-color:rgba(47,111,224,.45); box-shadow:0 12px 28px rgba(0,0,0,.4);}
  .dash-card-top{display:flex; align-items:center; justify-content:space-between;}
  .dash-card-icon{
    width:34px; height:34px; border-radius:10px; flex:0 0 auto;
    background:linear-gradient(150deg, var(--blue-light), var(--blue)); color:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 10px rgba(47,111,224,.35);
  }
  .dash-card-icon svg{width:18px; height:18px;}
  .dash-card-modnum{font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint);}
  .dash-card-title{font-size:15.5px; font-weight:700; color:var(--text);}
  .dash-card-desc{font-size:12.8px; color:var(--text-dim); line-height:1.5; flex:1;}
  .dash-card-cta{
    font-size:12px; font-weight:700; color:var(--blue-light);
    display:flex; align-items:center; gap:5px; margin-top:4px;
  }
  .dash-card-cta .arrow{transition:transform .15s;}
  .dash-card:hover .dash-card-cta .arrow{transform:translateX(3px);}
  .dash-card:focus-visible{outline:none; box-shadow:var(--glow-blue); border-color:var(--blue-light);}

  /* ===== Module 1: Zusammenfassungen (Accordion) ===== */
  .acc-item{border:1px solid var(--border); border-radius:var(--radius-md); margin-bottom:10px; overflow:hidden; background:var(--panel-2); transition:border-color .15s;}
  .acc-item.open{border-color:rgba(47,111,224,.4);}
  .acc-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; cursor:pointer; gap:10px; transition:background .15s;}
  .acc-head:hover{background:rgba(255,255,255,.02);}
  .acc-head .art{font-weight:700; color:var(--blue-light); font-size:13px; flex:0 0 auto; min-width:64px;}
  .acc-head .title{font-weight:600; font-size:14px; flex:1;}
  .acc-head .chev{transition:transform .2s; color:var(--text-faint); flex:0 0 auto;}
  .acc-item.open .chev{transform:rotate(180deg); color:var(--blue-light);}
  .acc-body{max-height:0; overflow:hidden; transition:max-height .25s ease;}
  .acc-item.open .acc-body{max-height:600px;}
  .acc-body-inner{padding:0 18px 18px; font-size:13.5px; color:var(--text-dim); line-height:1.6;}
  .schema-box{margin-top:10px; background:var(--bg-2); border:1px dashed var(--border); border-radius:var(--radius-sm); padding:10px 14px; font-size:12.5px; line-height:1.55;}
  .schema-box b{color:var(--text);}

  /* ===== Module 2: Flashcards ===== */
  .fc-wrap{display:flex; flex-direction:column; align-items:center; gap:18px;}
  .fc-card{
    width:100%; max-width:480px; height:240px; perspective:1400px; cursor:pointer;
  }
  .fc-inner{position:relative; width:100%; height:100%; transition:transform .5s cubic-bezier(.4,.2,.2,1); transform-style:preserve-3d;}
  .fc-card.flipped .fc-inner{transform:rotateY(180deg);}
  .fc-face{
    position:absolute; inset:0; backface-visibility:hidden;
    border-radius:var(--radius-lg); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    padding:30px 30px 52px; box-shadow:var(--shadow);
  }
  .fc-text{
    text-align:center; max-height:100%; overflow-y:auto; overflow-x:hidden;
    padding-right:2px; scrollbar-width:thin;
  }
  .fc-front{background:linear-gradient(160deg, var(--panel-2), var(--panel)); color:var(--text);}
  .fc-front .fc-text{font-size:19px; font-weight:700; line-height:1.4;}
  .fc-back{background:linear-gradient(155deg, #2a5bc4, #2F6FE0 55%, #3a7bf0); transform:rotateY(180deg);}
  .fc-back .fc-text{font-size:14.5px; font-weight:500; line-height:1.62; color:#F3F6FF;}
  .fc-hint{
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    padding:6px 14px; border-radius:999px; white-space:nowrap; pointer-events:none;
  }
  .fc-front .fc-hint{color:var(--text-faint); background:rgba(255,255,255,.05); border:1px solid var(--border);}
  .fc-back .fc-hint{color:rgba(255,255,255,.95); background:rgba(0,0,0,.2); border:1px solid rgba(255,255,255,.18);}
  .fc-controls{display:flex; align-items:center; gap:16px;}
  .fc-counter{font-size:12.5px; color:var(--text-faint); min-width:50px; text-align:center; font-weight:600;}

  /* ===== Module 3: Quiz ===== */
  .quiz-q{font-size:15px; font-weight:600; margin-bottom:14px;}
  .quiz-opts{display:flex; flex-direction:column; gap:9px; margin-bottom:14px;}
  .quiz-opt{
    text-align:left; background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    padding:11px 14px; border-radius:var(--radius-md); cursor:pointer; font-size:13.5px;
    transition:border-color .15s, background .15s;
  }
  .quiz-opt:hover{border-color:var(--blue-light);}
  .quiz-opt.correct{background:rgba(56,178,107,.15); border-color:var(--good); color:#BFF2D3;}
  .quiz-opt.wrong{background:rgba(224,83,62,.15); border-color:var(--bad); color:#F5C4BB;}
  .quiz-opt[disabled]{cursor:default;}
  .quiz-explain{font-size:12.8px; color:var(--text-dim); background:var(--bg-2); border-radius:var(--radius-sm); padding:10px 14px; margin-bottom:14px; display:none;}
  .quiz-explain.show{display:block;}
  .quiz-progress{display:flex; gap:6px; margin-bottom:16px;}
  .quiz-progress span{flex:1; height:5px; border-radius:4px; background:var(--panel-2);}
  .quiz-progress span.done{background:var(--blue);}
  .quiz-result{text-align:center; padding:20px 0;}
  .quiz-result .score{font-size:38px; font-weight:800; margin-bottom:4px;}

  /* ===== Module 4: Zuordnungsspiel ===== */
  .match-wrap{display:grid; grid-template-columns:1fr 1fr; gap:24px;}
  @media(max-width:700px){.match-wrap{grid-template-columns:1fr;}}
  .match-col-title{font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); margin-bottom:10px; font-weight:700;}
  .match-item{
    background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:11px 14px; margin-bottom:8px; cursor:pointer; font-size:13.5px; transition:all .15s;
  }
  .match-item:hover{border-color:var(--blue-light);}
  .match-item.selected{border-color:var(--blue); background:var(--blue-dim); box-shadow:var(--glow-blue);}
  .match-item.matched{border-color:var(--good); background:rgba(56,178,107,.12); color:var(--text-faint); cursor:default;}
  .match-item.shake{border-color:var(--bad); background:rgba(224,83,62,.12);}
  .match-status{margin-top:14px; font-size:12.5px; color:var(--text-faint); font-weight:600;}

  /* ===== Module 5: Radar ===== */
  .radar-wrap{display:flex; gap:28px; flex-wrap:wrap; align-items:flex-start;}
  .radar-list{flex:1; min-width:220px;}
  .radar-list .ritem{display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border-soft); font-size:13px;}
  .radar-list .rbar{flex:1; height:6px; background:var(--panel-2); border-radius:4px; margin:0 12px; overflow:hidden;}
  .radar-list .rbar i{display:block; height:100%; border-radius:4px; transition:width .6s ease;}
  .radar-list .rval{font-size:12px; color:var(--text-faint); width:34px; text-align:right; font-weight:600;}
  .reco{margin-top:16px; background:var(--bg-2); border-left:3px solid var(--blue); border-radius:var(--radius-sm); padding:12px 14px; font-size:13px; color:var(--text-dim); line-height:1.55;}

  /* ===== Module 6: Formelkasten ===== */
  .tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .tab{padding:8px 15px; border-radius:999px; background:var(--panel-2); border:1px solid var(--border); color:var(--text-dim); font-size:12.8px; cursor:pointer; font-weight:600; transition:all .15s;}
  .tab:hover{border-color:var(--blue-light); color:var(--text);}
  .tab.active{background:linear-gradient(150deg, var(--blue-light), var(--blue)); color:#fff; border-color:var(--blue); box-shadow:0 3px 10px rgba(47,111,224,.35);}
  .formula-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px;}
  .fcard{background:var(--panel-2); border:1px solid var(--border); border-top:2px solid rgba(47,111,224,.45); border-radius:var(--radius-md); padding:16px; display:none; transition:transform .15s, border-color .15s;}
  .fcard:hover{transform:translateY(-2px); border-top-color:var(--blue-light);}
  .fcard.show{display:block;}
  .fcard .eq{font-size:20px; font-weight:800; color:var(--blue-light); margin-bottom:8px;}
  .fcard .name{font-size:13px; font-weight:700; margin-bottom:5px;}
  .fcard .vars{font-size:11.8px; color:var(--text-faint); line-height:1.5;}

  /* ===== Module 7: Altklausuren-Simulator ===== */
  .timer-bar{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
  .timer-track{flex:1; height:8px; background:var(--panel-2); border-radius:4px; overflow:hidden;}
  .timer-fill{height:100%; background:linear-gradient(90deg, var(--blue), var(--blue-light)); width:100%; transition:width 1s linear;}
  .timer-num{font-size:13px; font-weight:700; color:var(--text-dim); width:44px; text-align:right;}

  /* ===== Module 9: Fallbeispiel ===== */
  .case-step{background:var(--panel-2); border:1px solid var(--border); border-left:3px solid var(--blue); border-radius:var(--radius-md); padding:16px 18px; margin-bottom:12px;}
  .case-step .k{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--blue-light); font-weight:700; margin-bottom:6px;}
  .case-choices{display:flex; flex-direction:column; gap:8px; margin-top:10px;}

  /* ===== Module 10: Experiment-Trainer ===== */
  .calc-row{display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap;}
  .calc-row label{font-size:13px; color:var(--text-dim); flex:0 0 210px;}
  .calc-row input{
    background:var(--bg-2); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:9px 12px; color:var(--text); font-size:13.5px; width:140px;
    outline:none; transition:border-color .15s, box-shadow .15s;
  }
  .calc-row input:focus{border-color:var(--blue-light); box-shadow:var(--glow-blue);}
  .calc-steps{background:var(--bg-2); border-radius:var(--radius-md); padding:14px 16px; font-size:13px; color:var(--text-dim); line-height:1.7; margin-top:14px; display:none;}
  .calc-steps.show{display:block;}
  .calc-steps b{color:var(--text);}

  /* ===== Module 11: Unterrichtsentwurf ===== */
  .phase-tabs{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .phase-panel{display:none; font-size:13.5px; color:var(--text-dim); line-height:1.65;}

const radarData = [

function buildRadarSvg(data){
  const size=300, cx=size/2, cy=size/2, r=100;
  const n = data.length;
  const angle = i => (Math.PI*2*i/n) - Math.PI/2;
  let gridRings = [0.25,0.5,0.75,1].map(f=>{
    const pts = data.map((_,i)=>{
      const a=angle(i); return `${cx+Math.cos(a)*r*f},${cy+Math.sin(a)*r*f}`;
    }).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1"/>`;
  }).join('');
  let axes = data.map((_,i)=>{
    const a = angle(i);
    const x2 = cx+Math.cos(a)*r, y2 = cy+Math.sin(a)*r;
    return `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="rgba(255,255,255,.1)" stroke-width="1"/>`;
  }).join('');
  let dataPts = data.map((d,i)=>{
    const a = angle(i); const f = d.val/100;
    return `${cx+Math.cos(a)*r*f},${cy+Math.sin(a)*r*f}`;
  }).join(' ');
  let dots = data.map((d,i)=>{
    const a = angle(i); const f = d.val/100;
    const x = cx+Math.cos(a)*r*f, y = cy+Math.sin(a)*r*f;
    return `<circle cx="${x}" cy="${y}" r="4" fill="#2F6FE0"/>`;
  }).join('');
  let labels = data.map((d,i)=>{
    const a = angle(i);
    const lr = r + 34;
    let x = cx+Math.cos(a)*lr, y = cy+Math.sin(a)*lr;
    let anchor = 'middle';
    if(Math.cos(a) > 0.3) anchor='start';
    else if(Math.cos(a) < -0.3) anchor='end';
    return `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="11" fill="#B4B7C4" font-family="inherit">${d.label}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size+20}" width="320" height="340" xmlns="http://www.w3.org/2000/svg">
    ${gridRings}${axes}
    <polygon points="${dataPts}" fill="rgba(47,111,224,.22)" stroke="#2F6FE0" stroke-width="2"/>
    ${dots}
    ${labels}
  </svg>`;
}

     choices:["Abdomensonographie anordnen", "Direkt Antibiotikum geben und entlassen"]},
    {k:"Bildgebung", txt:"Sonographie zeigt eine verdickte, nicht komprimierbare Appendix (Durchmesser 9 mm) mit umgebender freier Flüssigkeit.",
     choices:["Verdachtsdiagnose stellen"]},
  ];
  if(caseStep < steps.length){
    const s = steps[caseStep];
    caseCardEl.innerHTML = `<div class="case-step">
        <div class="k">${s.k}</div>
        <div>${s.txt}</div>
        <div class="case-choices">${s.choices.map((c,i)=>`<button class="btn ghost small case-choice" data-i="${i}">${c}</button>`).join('')}</div>
      </div>`;
    caseCardEl.querySelectorAll('.case-choice').forEach(btn=>{
      btn.addEventListener('click', ()=>{ caseStep++; renderCase(); });
    });
  } else {
    caseCardEl.innerHTML = `<div class="case-step">
      <div class="k">Differentialdiagnose</div>
      <div>Klinik, Labor und Sonographie sprechen in der Zusammenschau am ehesten für eine <b>akute Appendizitis</b>.
      Wichtige Differentialdiagnosen bei akuten Bauchschmerzen rechts unten: Gallenkolik (eher rechter Oberbauch),
      Ovarialzyste/-torsion, Harnleiterkolik, Meckel-Divertikel, Adnexitis.</div>
      <div class="schema-box" style="margin-top:12px;"><b>Empfohlenes Vorgehen:</b> chirurgisches Konsil, ggf. laparoskopische Appendektomie.</div>
      <button class="btn small" id="caseRestart" style="margin-top:14px;">Fall neu starten</button>
    </div>`;
    document.getElementById('caseRestart').addEventListener('click', ()=>{ caseStep=0; renderCase(); });
  }
}

   MODULE 10 — Experiment-Trainer — Chemie, Stöchiometrie

document.getElementById('calcBtn').addEventListener('click', ()=>{
  const mMg = parseFloat(document.getElementById('mgInput').value);
  const stepsEl = document.getElementById('calcSteps');
  if(!mMg || mMg<=0){
    stepsEl.innerHTML = `Bitte gib eine gültige Masse für Magnesium ein.`;
    stepsEl.classList.add('show');
    return;
  }
  const M_Mg = 24.31; // g/mol
  const M_MgO = 40.30; // g/mol
  const n_Mg = mMg / M_Mg;
  const n_MgO = n_Mg; // 2 Mg : 2 MgO -> 1:1
  const m_MgO = n_MgO * M_MgO;
  stepsEl.innerHTML = `
    <div><b>Reaktionsgleichung:</b> 2 Mg + O₂ → 2 MgO (Stoffmengenverhältnis Mg : MgO = 1 : 1)</div>
    <div style="margin-top:8px;"><b>1. Stoffmenge Mg berechnen:</b> n(Mg) = m / M = ${mMg} g / ${M_Mg} g/mol = <b>${n_Mg.toFixed(3)} mol</b></div>
    <div><b>2. Stoffmenge MgO (1:1-Verhältnis):</b> n(MgO) = ${n_Mg.toFixed(3)} mol</div>
    <div><b>3. Masse MgO berechnen:</b> m(MgO) = n · M = ${n_Mg.toFixed(3)} mol × ${M_MgO} g/mol = <b>${m_MgO.toFixed(2)} g</b></div>
    <div style="margin-top:8px; color:var(--text);">→ Aus ${mMg} g Magnesium entstehen theoretisch ${m_MgO.toFixed(2)} g Magnesiumoxid.</div>
  `;
  stepsEl.classList.add('show');
});

const glossary = [
  {term:"Assimilation", def:"Nach Piaget: Einordnung neuer Informationen in bereits vorhandene kognitive Schemata."},
  {term:"Akkommodation", def:"Nach Piaget: Anpassung bestehender kognitiver Schemata an neue Informationen, wenn diese nicht ins bestehende Schema passen."},
  {term:"Objektpermanenz", def:"Das Verständnis, dass Objekte weiter existieren, auch wenn sie nicht wahrgenommen werden — entwickelt sich in der sensomotorischen Phase (Piaget)."},
  {term:"Bindungstheorie", def:"Nach Bowlby/Ainsworth: Theorie über die emotionale Beziehung zwischen Kind und Bezugsperson und deren Einfluss auf die spätere Entwicklung."},
  {term:"Sensible Phase", def:"Zeitfenster, in dem ein Organismus besonders empfänglich für bestimmte Entwicklungsreize ist (z. B. Spracherwerb)."},
  {term:"Zone der nächsten Entwicklung", def:"Nach Wygotski: Abstand zwischen dem, was ein Kind allein leisten kann, und dem, was es mit Unterstützung leisten kann."},
  {term:"Reifung", def:"Biologisch gesteuerte Entwicklung, die weitgehend unabhängig von Umwelteinflüssen abläuft."},
  {term:"Sozialisation", def:"Prozess, durch den ein Individuum die Werte, Normen und Verhaltensweisen seiner Gesellschaft erlernt und verinnerlicht."},
];
const glossHost = document.getElementById('glossList');
function renderGlossary(filter=''){
  glossHost.innerHTML='';
  glossary.filter(g=> g.term.toLowerCase().includes(filter.toLowerCase()) || g.def.toLowerCase().includes(filter.toLowerCase()))
    .forEach(g=>{
      const d = document.createElement('div');
      d.className='glossary-item';
      d.innerHTML = `<div class="term">${g.term}</div><div class="def">${g.def}</div>`;
      glossHost.appendChild(d);
    });
  if(!glossHost.children.length){ glossHost.innerHTML = `<div style="color:var(--text-faint); font-size:13px; padding:10px 0;">Kein Begriff gefunden.</div>`; }
}
document.getElementById('glossSearch').addEventListener('input', e=> renderGlossary(e.target.value));
renderGlossary();

function buildMapSvg(){
  const w=760, h=520, cx=w/2, cy=h/2;
  const branches = [
    {label:"Bündnissysteme", detail:"Zweibund/Dreibund vs. Triple Entente", angle:-90},
    {label:"Nationalismus", detail:"Spannungen auf dem Balkan, Panslawismus", angle:-18},
    {label:"Wettrüsten", detail:"Deutsch-britisches Flottenwettrüsten", angle:54},
    {label:"Imperialismus", detail:"Konkurrenz um Kolonien &amp; Märkte", angle:126},
    {label:"Julikrise 1914", detail:"Attentat von Sarajevo als Auslöser", angle:198},
  ];
  const R = 195;
  let lines='', nodes='';
  branches.forEach(b=>{
    const rad = b.angle*Math.PI/180;
    const x = cx+Math.cos(rad)*R, y = cy+Math.sin(rad)*R;
    lines += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(47,111,224,.4)" stroke-width="2"/>`;
    const boxW=190, boxH=64;
    nodes += `
      <g transform="translate(${x-boxW/2},${y-boxH/2})">
        <rect width="${boxW}" height="${boxH}" rx="16" fill="#1C1D24" stroke="#2F6FE0" stroke-width="1.5"/>
        <text x="${boxW/2}" y="24" text-anchor="middle" font-size="13.5" font-weight="700" fill="#F2F3F7">${b.label}</text>
        <foreignObject x="10" y="30" width="${boxW-20}" height="${boxH-32}">
          <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:10.8px; color:#B4B7C4; line-height:1.35; font-family:inherit; text-align:center;">${b.detail}</div>
        </foreignObject>
      </g>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px; display:block; margin:0 auto;" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="${w}" height="${h}" fill="transparent"/>
    ${lines}
    <g transform="translate(${cx-115},${cy-42})">
      <rect width="230" height="84" rx="20" fill="#2F6FE0" />
      <text x="115" y="34" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">Erster Weltkrieg</text>
      <text x="115" y="56" text-anchor="middle" font-size="12" font-weight="600" fill="#DCE7FF">— Ursachen —</text>
    </g>
    ${nodes}
  </svg>`;
}
document.getElementById('mapSvgWrap').innerHTML = buildMapSvg();
